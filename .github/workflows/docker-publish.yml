name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Version Config
        id: config
        run: |
          echo "TAG=$(jq -r .tag version.json)" >> $GITHUB_OUTPUT
          echo "UPDATE_LATEST=$(jq -r .update_latest version.json)" >> $GITHUB_OUTPUT
          echo "SHOULD_PUSH=$(jq -r .push version.json)" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$(jq -r .image_name version.json)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: steps.config.outputs.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.config.outputs.SHOULD_PUSH == 'true' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Generate Docker Tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/$OWNER/${{ steps.config.outputs.IMAGE_NAME }}"
          TAG="${{ steps.config.outputs.TAG }}"
          UPDATE_LATEST="${{ steps.config.outputs.UPDATE_LATEST }}"

          TAGS="$GHCR_IMAGE:$TAG"
          if [ "$UPDATE_LATEST" = "true" ]; then
            TAGS="$TAGS,$GHCR_IMAGE:latest"
          fi

          if [ -n "$DOCKER_USERNAME" ]; then
            DH_IMAGE="$DOCKER_USERNAME/${{ steps.config.outputs.IMAGE_NAME }}"
            TAGS="$TAGS,$DH_IMAGE:$TAG"
            if [ "$UPDATE_LATEST" = "true" ]; then
              TAGS="$TAGS,$DH_IMAGE:latest"
            fi
          fi

          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.config.outputs.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max