# Features Categories & FAQ
features.cat.all=すべての機能
features.cat.core=コアインフラ
features.cat.dev=開発者ツール

faq.title=よくある質問
faq.description=GladTekについてご質問がありますか？必要なすべての回答を以下でご確認いただけます。
faq.q1.question=GladTekはどのような技術をサポートしていますか？
faq.q1.answer=GladTekはVaadin、Spring Boot、Tailwind CSS、および各種リレーショナル/NoSQLデータベースをネイティブサポートしています。最新のJavaスタックに最適化されています。
faq.q2.question=スケーリングはどのように機能しますか？
faq.q2.answer=当社のプラットフォームは自動化されたKubernetesインフラ上で動作します。リアルタイムのリクエストトラフィックとCPU負荷に応じて自動的にスケールアップ/ダウンします。
faq.q3.question=カスタムスタイルを統合できますか？
faq.q3.answer=もちろんです。標準のTailwind設定およびVaadin Flowビューに統合されたカスタムCSS変数を通じて、配色、タイポグラフィ、テーマコンポーネントを自由に変更できます。
faq.q4.question=カスタムSLAサポートは提供していますか？
faq.q4.answer=はい！エンタープライズプランには、カスタムSLA、24時間365日の電話サポート、プレミアムな開発者導入パッケージが含まれています。

