# Features Categories & FAQ
features.cat.all=جميع الميزات
features.cat.core=البنية الأساسية
features.cat.dev=أدوات المطورين

faq.title=الأسئلة الشائعة
faq.description=هل لديك أسئلة حول ڨلادتاك؟ لدينا الإجابات. اعثر على كل ما تحتاج معرفته أدناه.
faq.q1.question=ما هي التقنيات التي تدعمها ڨلادتاك؟
faq.q1.answer=تقدم ڨلادتاك دعماً من الدرجة الأولى لـ Vaadin و Spring Boot و Tailwind CSS ومختلف قواعد البيانات العلائقية أو NoSQL. وهي مهيأة بالكامل للمنظومات الحديثة المبنية على Java.
faq.q2.question=كيف يعمل التوسع التلقائي؟
faq.q2.answer=تعمل منصتنا على بنية تحتية مؤتمتة قائمة على Kubernetes. نقوم بزيادة أو تقليص عُقد تطبيقك تلقائياً حسب حركة الطلبات واستخدام المعالج في الوقت الفعلي.
faq.q3.question=هل يمكنني دمج أنماط وتنسيقات مخصصة؟
faq.q3.answer=بالتأكيد. من خلال إعدادات Tailwind القياسية ومتغيرات CSS المخصصة المدمجة في واجهات Vaadin Flow، يمكنك تعديل نظام الألوان، الخطوط، ومكونات القوالب.
faq.q4.question=هل تقدمون دعماً مخصصاً لاتفاقيات مستوى الخدمة (SLA)؟
faq.q4.answer=نعم! تتضمن خطة المؤسسات اتفاقيات مستوى خدمة مخصصة (SLAs)، ودعماً هاتفياً مخصصاً على مدار الساعة طوال أيام الأسبوع، وحزم تدريب وتأهيل متميزة للمطورين.

